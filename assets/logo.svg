<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 84" width="100%" height="100%" fill="none">
  <defs>
    <!-- 主漸層：深青碧到醫學青藍 -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- 金黃陽光漸層 (懸壺與光明之意) -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- 柔和陰影 -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0d9488" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- ================= LOGO ICON BADGE (左側圖標) ================= -->
  <g transform="translate(4, 4)" filter="url(#badgeShadow)">
    <rect x="0" y="0" width="76" height="76" rx="20" fill="url(#primaryGrad)"/>
    <rect x="1" y="1" width="74" height="74" rx="19" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

    <circle cx="38" cy="38" r="28" fill="white" fill-opacity="0.06"/>
    
    <!-- 懸壺輪廓線條 (葫蘆意象) -->
    <path d="M38 14 C43 14 47 18 47 22 C47 26 44 29 41 31 C48 34 51 40 51 47 C51 57 45 63 38 63 C31 63 25 57 25 47 C25 40 28 34 35 31 C32 29 29 26 29 22 C29 18 33 14 38 14 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="2.2" 
          stroke-linecap="round"
          opacity="0.9"/>

    <!-- 雙翼 -->
    <path d="M38 27 C31 20 19 22 14 29 C22 30 29 34 35 38 Z" fill="white" fill-opacity="0.95"/>
    <path d="M38 27 C45 20 57 22 62 29 C54 30 47 34 41 38 Z" fill="white" fill-opacity="0.95"/>
    
    <path d="M37 32 C29 29 22 31 18 37 C24 37 31 40 35 44 Z" fill="#99f6e4" fill-opacity="0.9"/>
    <path d="M39 32 C47 29 54 31 58 37 C52 37 45 40 41 44 Z" fill="#99f6e4" fill-opacity="0.9"/>

    <!-- 中央脊椎神杖 -->
    <line x1="38" y1="16" x2="38" y2="60" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
    
    <!-- 皇冠星芒頂飾 -->
    <circle cx="38" cy="16" r="4" fill="url(#goldGrad)"/>
    <path d="M38 10 L39.2 14.5 L43 16 L39.2 17.5 L38 22 L36.8 17.5 L33 16 L36.8 14.5 Z" fill="#fde047"/>

    <!-- 螺旋修復線 -->
    <path d="M32 30 C32 27 43 27 43 33 C43 40 31 39 31 45 C31 52 44 51 43 58" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="2.8" 
          stroke-linecap="round"/>
  </g>

  <!-- ================= 放大後的文字排版 ================= -->
  <!-- 1. 主名稱：光明診所 (加大字級至 43px，沉穩醒目) -->
  <text x="94" y="47" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="900" font-size="43" fill="#0f172a" letter-spacing="1.5">
    光明診所
  </text>

  <!-- 2. 專科膠囊徽章 (加大字級與視覺焦點) -->
  <g transform="translate(288, 16)">
    <rect x="0" y="0" width="138" height="32" rx="16" fill="#ccfbf1"/>
    <rect x="0.5" y="0.5" width="137" height="31" rx="15.5" stroke="#0d9488" stroke-width="1.2"/>
    <text x="69" y="21.5" font-family="'Noto Sans TC', sans-serif" font-weight="800" font-size="14" fill="#0f766e" text-anchor="middle" letter-spacing="0.5">
      健保骨科復健
    </text>
  </g>

  <!-- 3. 次行英文副標 (字級由 13px 加大至 15px) -->
  <text x="96" y="73" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="15" fill="#0d9488" letter-spacing="3">
    KING'S CLINIC
  </text>

  <!-- 4. 次行診療服務項目 (字級由 11px 加大至 14px，加粗易讀) -->
  <text x="248" y="73" font-family="'Noto Sans TC', sans-serif" font-weight="700" font-size="13.5" fill="#475569" letter-spacing="1">
    • 骨科 • 復健科 • 台北榮總合作
  </text>
</svg>
